worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    upstream internal_backend {
        # FastAPI backend from internal_module/internal_main.py.
        # If you run uvicorn on another port (for example 8000), update this line.
        server 127.0.0.1:6666;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Built Vite frontend.
        root /workspace/internal_module/frontend/dist;
        index index.html;

        # FastAPI API routes.
        location /api/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_pass http://internal_backend;
        }

        # Optional FastAPI docs endpoints.
        location ~ ^/(docs|redoc|openapi\.json)$ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://internal_backend;
        }

        # Cache static assets generated by Vite.
        location ~* \.(?:css|js|mjs|map|ico|gif|jpe?g|png|svg|webp|woff2?)$ {
            try_files $uri =404;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            access_log off;
        }

        # SPA fallback for routes like /b1.
        location / {
            try_files $uri /index.html;
        }
    }
}
