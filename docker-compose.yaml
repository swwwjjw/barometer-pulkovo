services:
  internal_module:
    container_name: internal_module
    build:
      context: ./internal_module
      dockerfile: Dockerfile
      # context: .
      # dockerfile: ./internal_module/Dockerfile
    ports:
      - "8083:8083"
    volumes:
      - hh_data:/app/hh_data
      - /mnt/allshare_fileserver/barometer_vacancies:/mnt/allshare_fileserver/barometer_vacancies
    restart: unless-stopped

volumes:
  hh_data:
